<script src="posts.js"></script>
<script>
const sidebar = document.getElementById('sidebar');
const panel = document.getElementById('panel');
const blogLayout = document.getElementById('blog-layout');
const backButton = document.getElementById('back-button');

if (window.innerWidth <= 450) {
    backButton.addEventListener('click', () => {
        blogLayout.classList.remove('post-open');
        setBackground(); // back to the default background
    });
}

// make relative image paths in markdown resolve against posts/
const renderer = new marked.Renderer();

renderer.image = ({ href, title, text }) => {
    const resolved = /^(https?:)?\//.test(href) ? href : `posts/${href}`;
    return `<img src="${resolved}" alt="${text}" title="${title || ''}">`;
};

marked.setOptions({ renderer });

posts.forEach(post => {
    const item = document.createElement('div');
    item.className = 'post-item';
    item.innerHTML = `<div class="post-title">${post.title}</div><div class="post-date">${post.date}</div>`;
    item.addEventListener('click', () => {
        loadPost(post.file, post.title, post.date);
        setBackground(post.images && `posts/images/${post.images}/bg.webp`);
    });
    sidebar.appendChild(item);
});

// per-post background: posts/images/<images>/bg.webp (any format the browser can decode),
// falls back to the default one. fades when it loads, swaps instantly when it doesn't.
// set through a real <style> rule (no css variables) so extensions like dark reader keep up.
const DEFAULT_BG = 'url("/images/background.webp")';
const bgStyle = document.head.appendChild(document.createElement('style'));
let currentBg = DEFAULT_BG;
let bgRequest = 0;
let bgFade = null;

function paintBackground(top, under) {
    bgStyle.textContent = `body::before { background-image: ${top}; }` +
        ` html::before { background-image: ${under || 'none'}; }`;
}

function setBackground(src) {
    const request = ++bgRequest;

    const apply = (bg, fade) => {
        if (request !== bgRequest || bg === currentBg) return;
        if (bgFade) bgFade.cancel();

        paintBackground(bg, fade && currentBg); // old image stays underneath during the fade
        currentBg = bg;
        if (!fade) return;

        try {
            bgFade = document.body.animate(
                { opacity: [0, 1] },
                { duration: 600, easing: 'ease', pseudoElement: '::before' }
            );
            bgFade.onfinish = () => { if (request === bgRequest) paintBackground(bg); };
        } catch {
            paintBackground(bg); // no animation support: plain swap
        }
    };

    if (!src) return apply(DEFAULT_BG, true);

    const img = new Image();
    img.onload = () => apply(`url("${img.src}")`, true);
    img.onerror = () => apply(DEFAULT_BG, false);
    img.src = src;
}

function loadPost(file, title, date) {
    blogLayout.classList.add('post-open');

    fetch(file)
        .then(res => res.text())
        .then(md => {
            md = md.replace(/!\[\[([^\]]+)\]\]/g, (_, image) => {
                return `![${image}](${encodeURIComponent(image)})`;
            });

            panel.innerHTML = `<h2>${title}</h2><p class="post-date">${date}</p>${marked.parse(md)}`;
        })
        .catch(err => {
            panel.innerHTML = `<p>Couldn't load that post. ${err}</p>`;
        });
}
</script>
